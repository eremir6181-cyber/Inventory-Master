name: Build Inventory Master

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip "$ZIP" -d project

      - name: Build JAR
        run: |
          cd project/InventoryMaster
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: InventoryMaster-JAR
          path: project/InventoryMaster/build/libs/*-1.0.0.jar
